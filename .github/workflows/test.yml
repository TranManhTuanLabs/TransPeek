name: Tests

# When this workflow runs:
# - On every push to main and every pull request to main (but NOT for docs-only
#   changes — see paths-ignore below, so editing a .md file never starts a run).
# - Manually, from the GitHub Actions tab ("Run workflow").
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

# What this workflow is allowed to do:
# - Read the repo contents (checkout).
# - Manage Actions artifacts (upload the app and test results, delete old app builds).
permissions:
  contents: read
  actions: write

# Only one run per branch at a time. A newer push cancels the older run that is
# still in progress, so CI never wastes time on an outdated commit.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macOS runner. Every run gets a fresh virtual machine, so nothing from a
    # previous run survives — only uploaded artifacts are kept.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      # Download the repo code onto the runner.
      - name: Checkout
        uses: actions/checkout@v4

      # Reuse the previously downloaded Tuist tool so the run does not download
      # it again. The cache key changes when .mise.toml or .tuist-version changes.
      - name: Cache mise tools (Tuist)
        uses: actions/cache@v4
        with:
          path: ~/.local/share/mise/installs
          key: mise-${{ runner.os }}-${{ hashFiles('.mise.toml', '.tuist-version') }}-v2
          restore-keys: |
            mise-${{ runner.os }}-

      # Install Tuist (the tool that generates the Xcode project from Project.swift).
      - name: Install Tuist via mise
        uses: jdx/mise-action@v2
        with:
          install: true

      # Reuse previously downloaded Swift Package Manager artifacts (e.g. Sparkle).
      - name: Cache Swift Package Manager artifacts
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm/artifacts
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}-v2
          restore-keys: |
            spm-${{ runner.os }}-

      # Fetch the Swift packages and generate the Xcode workspace/project.
      # Retries up to 3 times because a flaky network or a busy GitHub can make
      # the download fail once; a real code problem still fails after 3 tries.
      - name: Resolve dependencies and generate project
        run: |
          cp Configurations/Signing.xcconfig.example Configurations/Signing.xcconfig
          attempt=1
          until tuist install && tuist generate --no-open; do
            if [ "$attempt" -ge 3 ]; then
              echo "Dependency resolve failed after 3 attempts"
              exit 1
            fi
            echo "Dependency resolve failed (attempt $attempt/3); retrying in 30s..."
            attempt=$((attempt + 1))
            sleep 30
          done

      # Install xcbeautify, which turns xcodebuild's noisy output into readable lines.
      - name: Install xcbeautify
        run: brew install xcbeautify

      # Run the full test suite (unit tests). pipefail makes the step fail when
      # xcodebuild fails, even though its output goes through xcbeautify.
      # SPARKLE_ED_PUBLIC_KEY is Sparkle's public EdDSA key (public, safe to
      # hardcode): without it the built app has no updater key and Sparkle
      # cannot start. CODE_SIGNING_ALLOWED=NO because tests do not need a
      # signed app. The test report is saved to build/Tests.xcresult and
      # uploaded at the end (see "Upload test results").
      - name: Run tests
        run: |
          set -o pipefail
          # RFC 8032 public test vector for Sparkle's test-host initialization.
          xcodebuild test \
            -workspace TransPeek.xcworkspace \
            -scheme TransPeek \
            -destination 'platform=macOS' \
            -resultBundlePath build/Tests.xcresult \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            SPARKLE_ED_PUBLIC_KEY=11qYAYKxCrfVS/7TyWQHOg7hcvPapiMlrwIaaPcHURo= \
            CODE_SIGNING_ALLOWED=NO \
          | xcbeautify

      # Build the Release app — ONLY when the commit message contains
      # "[build-app]". Plain test runs skip this step, so most pushes are fast.
      # CURRENT_PROJECT_VERSION is set to the GitHub run number, so the app's
      # build number (shown in About as "Build CI #<run>" and in the menubar
      # header) always matches the run that built it.
      - name: Build app
        if: contains(github.event.head_commit.message, '[build-app]')
        run: |
          xcodebuild build \
            -workspace TransPeek.xcworkspace \
            -scheme TransPeek \
            -configuration Release \
            -derivedDataPath build \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            SPARKLE_ED_PUBLIC_KEY=11qYAYKxCrfVS/7TyWQHOg7hcvPapiMlrwIaaPcHURo=

      # Sign the built app with the self-signed certificate "TransPeek Local 100Years"
      # (valid 100 years). Signing gives the app a stable identity, so macOS
      # keeps the Accessibility + Screen Recording permissions across builds
      # instead of forgetting them after every new build.
      # The .p12 in the MACOS_CODESIGN_CERT_P12 secret must be unencrypted
      # (openssl pkcs12 -export -legacy -keypbe NONE -certpbe NONE, no password):
      # OpenSSL 3.x defaults (SHA-256 MAC + AES-256) are rejected by macOS
      # `security import` with "MAC verification failed", and a legacy .p12
      # with an empty password is also rejected on recent macOS. Only runs
      # with "[build-app]" in the commit message reach this step.
      - name: Sign app with self-signed certificate
        if: contains(github.event.head_commit.message, '[build-app]')
        env:
          MACOS_CODESIGN_CERT_P12: ${{ secrets.MACOS_CODESIGN_CERT_P12 }}
        run: |
          printf '%s' "$MACOS_CODESIGN_CERT_P12" | base64 --decode > /tmp/TransPeek-signing.p12
          KEYCHAIN_PASSWORD="ci-signing-temp"
          security create-keychain -p "$KEYCHAIN_PASSWORD" /tmp/ci-signing.keychain-db
          security set-keychain-settings -lut 3600 /tmp/ci-signing.keychain-db
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" /tmp/ci-signing.keychain-db
          security import /tmp/TransPeek-signing.p12 -k /tmp/ci-signing.keychain-db -P "" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" /tmp/ci-signing.keychain-db
          security default-keychain -s /tmp/ci-signing.keychain-db
          codesign --force --deep --sign "TransPeek Local 100Years" build/Build/Products/Release/TransPeek.app
          codesign --verify --verbose build/Build/Products/Release/TransPeek.app
          rm -f /tmp/TransPeek-signing.p12

      # Zip the signed .app into TransPeek-macOS.zip for download.
      - name: Zip app
        if: contains(github.event.head_commit.message, '[build-app]')
        run: |
          ditto -c -k --keepParent build/Build/Products/Release/TransPeek.app TransPeek-macOS.zip

      # Upload the zip as the "TransPeek-macOS" artifact (kept 7 days).
      # This is the file the user downloads to test the app.
      - name: Upload app
        if: contains(github.event.head_commit.message, '[build-app]')
        uses: actions/upload-artifact@v4
        with:
          name: TransPeek-macOS
          path: TransPeek-macOS.zip
          retention-days: 7

      # Delete all older "TransPeek-macOS" artifacts, keeping only the newest
      # one. That way there is always exactly one app download link, and an old
      # link stops working once a newer build replaces it.
      - name: Delete older app artifacts (keep only the newest)
        if: contains(github.event.head_commit.message, '[build-app]')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" --jq '.artifacts | map(select(.name=="TransPeek-macOS")) | sort_by(.created_at) | reverse | .[1:] | .[].id')
          for id in $ids; do
            echo "Deleting old artifact $id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done

      # Always upload the test report (build/Tests.xcresult), even when tests
      # fail — that is how a failing test is diagnosed, because the console log
      # hides Swift Testing failure details. Kept 14 days.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macOS-test-results
          path: build/Tests.xcresult
          if-no-files-found: ignore
          retention-days: 14
