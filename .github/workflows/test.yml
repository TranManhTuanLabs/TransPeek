name: Tests

# When this workflow runs:
# - On every push to main and to feature/** branches, and every pull request
#   to main (but NOT for docs-only changes or workflow-only changes — see
#   paths-ignore below, so editing a .md file or a workflow file never
#   starts a run).
# - Manually, from the GitHub Actions tab ("Run workflow").
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/workflows/**'
  push:
    branches: [main, 'feature/**']
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/workflows/**'
  workflow_dispatch:

# What this workflow is allowed to do:
# - Read the repo contents (checkout).
# - Manage Actions artifacts (upload the app and test results, delete old app builds).
# contents: write is needed to create/delete pre-releases.
permissions:
  contents: write
  actions: write

# Only one run per branch at a time. A newer push cancels the older run that is
# still in progress, so CI never wastes time on an outdated commit.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macOS runner. Every run gets a fresh virtual machine, so nothing from a
    # previous run survives — only uploaded artifacts are kept.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      # Download the repo code onto the runner.
      - name: Checkout
        uses: actions/checkout@v4

      # Reuse the previously downloaded Tuist tool so the run does not download
      # it again. The cache key changes when .mise.toml or .tuist-version changes.
      - name: Cache mise tools (Tuist)
        uses: actions/cache@v4
        with:
          path: ~/.local/share/mise/installs
          key: mise-${{ runner.os }}-${{ hashFiles('.mise.toml', '.tuist-version') }}-v2
          restore-keys: |
            mise-${{ runner.os }}-

      # Install Tuist (the tool that generates the Xcode project from Project.swift).
      - name: Install Tuist via mise
        uses: jdx/mise-action@v2
        with:
          install: true

      # Reuse previously downloaded Swift Package Manager artifacts (e.g. Sparkle).
      - name: Cache Swift Package Manager artifacts
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm/artifacts
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}-v2
          restore-keys: |
            spm-${{ runner.os }}-

      # Fetch the Swift packages and generate the Xcode workspace/project.
      # Retries up to 3 times because a flaky network or a busy GitHub can make
      # the download fail once; a real code problem still fails after 3 tries.
      - name: Resolve dependencies and generate project
        run: |
          cp Configurations/Signing.xcconfig.example Configurations/Signing.xcconfig
          attempt=1
          until tuist install && tuist generate --no-open; do
            if [ "$attempt" -ge 3 ]; then
              echo "Dependency resolve failed after 3 attempts"
              exit 1
            fi
            echo "Dependency resolve failed (attempt $attempt/3); retrying in 30s..."
            attempt=$((attempt + 1))
            sleep 30
          done

      # Install xcbeautify, which turns xcodebuild's noisy output into readable lines.
      - name: Install xcbeautify
        run: brew install xcbeautify

      # Run the full test suite (unit tests). pipefail makes the step fail when
      # xcodebuild fails, even though its output goes through xcbeautify.
      # SPARKLE_ED_PUBLIC_KEY is Sparkle's public EdDSA key (public, safe to
      # hardcode): without it the built app has no updater key and Sparkle
      # cannot start. CODE_SIGNING_ALLOWED=NO because tests do not need a
      # signed app. The test report is saved to build/Tests.xcresult and
      # uploaded at the end (see "Upload test results").
      - name: Run tests
        run: |
          set -o pipefail
          # RFC 8032 public test vector for Sparkle's test-host initialization.
          xcodebuild test \
            -workspace TransPeek.xcworkspace \
            -scheme TransPeek \
            -destination 'platform=macOS' \
            -resultBundlePath build/Tests.xcresult \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            SPARKLE_ED_PUBLIC_KEY=+aGGc4fF2j3XJ3maoDbbwh/MmxP7BqDBdRs4A/r8f2M= \
            CODE_SIGNING_ALLOWED=NO \
          | xcbeautify

      # Build the Release app on every code push (always build — Manh 2026-11-18,
      # no more "[build-app]" gate: the repo is public so Actions minutes are
# free, and forgetting the tag used to cost a whole second run).
      # CURRENT_PROJECT_VERSION is set to the GitHub run number, so the app's
      # build number (shown in About as "Build CI #<run>" and in the menubar
      # header) always matches the run that built it.
      - name: Build app
        run: |
          xcodebuild build \
            -workspace TransPeek.xcworkspace \
            -scheme TransPeek \
            -configuration Release \
            -derivedDataPath build \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            SPARKLE_ED_PUBLIC_KEY=+aGGc4fF2j3XJ3maoDbbwh/MmxP7BqDBdRs4A/r8f2M=

      # Sign the built app with the self-signed certificate "TransPeek Self-Signed 100Years"
      # (valid 100 years). Signing gives the app a stable identity, so macOS
      # keeps the Accessibility + Screen Recording permissions across builds
      # instead of forgetting them after every new build.
      # Direction 4b (PEM certificate + key, NO PKCS12): the certificate and
      # the private key are imported separately as PEM files, so macOS never
      # has to parse a .p12 at all. Directions 1/3/3b all failed at `security
      # import` of a .p12 with "MAC verification failed": macOS 26 only
      # understands legacy PKCS12 (3DES/SHA-1) and rejects OpenSSL 3's
      # modern format (PBES2/AES-256 + SHA-256 MAC). Direction 2 (legacy
      # .p12) got past the MAC check but died on the RC2-40 cert bag
      # ("Unknown format in import"). The two SHA-256 checks below prove the
      # secrets arrived intact: if a hash mismatches, the secret — not the
      # format — is the problem, and the step stops there.
      - name: Sign app with self-signed certificate
        env:
          MACOS_CODESIGN_CERT_PEM: ${{ secrets.MACOS_CODESIGN_CERT_PEM }}
          MACOS_CODESIGN_KEY_PEM: ${{ secrets.MACOS_CODESIGN_KEY_PEM }}
        run: |
          printf '%s' "$MACOS_CODESIGN_CERT_PEM" | base64 --decode > /tmp/TransPeek-signing.crt
          printf '%s' "$MACOS_CODESIGN_KEY_PEM" | base64 --decode > /tmp/TransPeek-signing.key
          [ "$(shasum -a 256 /tmp/TransPeek-signing.crt | cut -d' ' -f1)" = "9354805dff7a8f50af55ed83006eede90a6145442d8cf3992fd153a0cdf9761a" ] || { echo "ERROR: certificate secret does not match the local file"; exit 1; }
          [ "$(shasum -a 256 /tmp/TransPeek-signing.key | cut -d' ' -f1)" = "e81b462f615f202b3e143591726199c60e86ae49d3d633fb97ea8e569fda54bc" ] || { echo "ERROR: private key secret does not match the local file"; exit 1; }
          KEYCHAIN_PASSWORD="ci-signing-temp"
          security create-keychain -p "$KEYCHAIN_PASSWORD" /tmp/ci-signing.keychain-db
          security set-keychain-settings -lut 3600 /tmp/ci-signing.keychain-db
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" /tmp/ci-signing.keychain-db
          security import /tmp/TransPeek-signing.crt -k /tmp/ci-signing.keychain-db -T /usr/bin/codesign
          security import /tmp/TransPeek-signing.key -k /tmp/ci-signing.keychain-db -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" /tmp/ci-signing.keychain-db
          security default-keychain -s /tmp/ci-signing.keychain-db
          codesign --force --deep --sign "TransPeek Self-Signed 100Years" build/Build/Products/Release/TransPeek.app
          codesign --verify --verbose build/Build/Products/Release/TransPeek.app
          rm -f /tmp/TransPeek-signing.crt /tmp/TransPeek-signing.key

      # Decide the artifact name suffix: a build on a feature branch gets
      # "-branch" (e.g. TransPeek-macOS-202-branch.zip) so a downloaded
      # branch build can never be mistaken for a main build
      # (TransPeek-macOS-202.zip). Main keeps the plain name — release.yml
      # finds the artifact by that name to package releases, so renaming
      # main would break the release flow.
      - name: Set artifact name suffix
        id: artifact-name
        run: |
          if [ "$GITHUB_REF" = 'refs/heads/main' ]; then
            echo "suffix=" >> "$GITHUB_OUTPUT"
          else
            echo "suffix=-branch" >> "$GITHUB_OUTPUT"
          fi

      # Zip the signed .app. The file name carries the Tests run number
      # (e.g. TransPeek-macOS-138.zip) so each downloaded build is distinct
      # and the user never has to rename it to tell builds apart. On a
      # feature branch the name gets a "-branch" suffix
      # (TransPeek-macOS-138-branch.zip) — see "Set artifact name suffix".
      - name: Zip app
        run: |
          ditto -c -k --keepParent build/Build/Products/Release/TransPeek.app "TransPeek-macOS-${{ github.run_number }}${{ steps.artifact-name.outputs.suffix }}.zip"

      # Upload the zip as the "TransPeek-macOS-<run number>" artifact (kept
      # 7 days). The run number in the name is what makes the downloaded
      # file distinct per build. On a feature branch the name gets a
      # "-branch" suffix (TransPeek-macOS-<run>-branch) — see "Set artifact
      # name suffix". release.yml finds this artifact by the
      # "TransPeek-macOS-" prefix (it also still accepts the old plain
      # "TransPeek-macOS" name from runs before this change).
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: TransPeek-macOS-${{ github.run_number }}${{ steps.artifact-name.outputs.suffix }}
          path: TransPeek-macOS-${{ github.run_number }}${{ steps.artifact-name.outputs.suffix }}.zip
          retention-days: 7

      # Delete all older app artifacts, keeping only the newest one. That
      # way there is always exactly one app download link, and an old link
      # stops working once a newer build replaces it. Matches both the old
      # plain "TransPeek-macOS" name and the new "TransPeek-macOS-<run>"
      # name, so artifacts from before this change are still cleaned up.
      # Branch artifacts ("TransPeek-macOS-<run>-branch") are excluded —
      # a main run must never delete a branch build Manh may still be
      # testing (branch artifacts expire on their own after 7 days).
      - name: Delete older app artifacts (keep only the newest)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" --jq '.artifacts | map(select((.name=="TransPeek-macOS" or (.name | startswith("TransPeek-macOS-"))) and (.name | endswith("-branch") | not))) | sort_by(.created_at) | reverse | .[1:] | .[].id')
          for id in $ids; do
            echo "Deleting old artifact $id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done

      # Publish a pre-release so the app can be downloaded from a direct
      # link (Releases page) instead of digging into the Actions run to
      # find the artifact. Same pattern as the Windows repo: tag
      # "v0.1.4.<run number>", prerelease, keep only the newest one.
      # The artifact upload above is still kept — release.yml (direction B)
      # promotes the tested artifact, and this pre-release is only a
      # convenience download for testing. Needs contents: write (see
      # permissions above) to create/delete releases.
      # NOTE: the "0.1.4" in the tag is the current MARKETING_VERSION —
      # update it here when the app version bumps.
      - name: Publish pre-release (direct download, keep only the newest)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v0.1.4.${{ github.run_number }}"
          zip="TransPeek-macOS-${{ github.run_number }}.zip"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" --prerelease --title "TransPeek macOS preview — Build CI #${{ github.run_number }}" --notes "Preview build from Tests run #${{ github.run_number }} (commit ${{ github.sha }}). Download the .zip, unzip, and open TransPeek.app. For testing only — the stable release is on the Releases page." "$zip"
          old=$(gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '[.[] | select(.prerelease and (.tag_name | test("^v0\.1\.4\\.[0-9]+$")))] | sort_by(.created_at) | reverse | .[1:] | .[].tag_name')
          for t in $old; do echo "Deleting old pre-release $t"; gh release delete "$t" --yes --cleanup-tag; done
      # Always upload the test report (build/Tests.xcresult), even when tests
      # fail — that is how a failing test is diagnosed, because the console log
      # hides Swift Testing failure details. Kept 14 days.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macOS-test-results
          path: build/Tests.xcresult
          if-no-files-found: ignore
          retention-days: 14
