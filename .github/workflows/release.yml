name: Release

# Builds a real release from a v* tag (or manually, as a draft, via
# workflow_dispatch): runs tests, archives the app, signs it, then creates
# the DMG, the Sparkle appcast and the GitHub Release with the ZIP + DMG +
# appcast + PopClip/OpenClip extensions.
# Signing uses Direction 4b (PEM certificate + key, NO PKCS12), the same as
# test.yml — see the "Import signing certificate" step. Do NOT go back to a
# .p12: macOS 26 only understands legacy PKCS12 (3DES/SHA-1) and rejects
# OpenSSL 3's modern format (PBES2/AES-256 + SHA-256 MAC). The original
# .p12 step failed on the v0.1.0 tag with "MAC verification failed" because
# the secrets it read (SIGNING_CERTIFICATE_P12 / SIGNING_CERTIFICATE_PASSWORD)
# do not exist on this repo.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 0.1.0)"
        required: false
        default: "0.0.0-dev"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    environment: Prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Install Tuist via mise
        uses: jdx/mise-action@v2
        with:
          install: true

      # Sign with the self-signed certificate "TransPeek Self-Signed 100Years"
      # (valid 100 years), the same Direction 4b (PEM certificate + key, NO
      # PKCS12) as test.yml: the certificate and the private key are imported
      # separately as PEM files, so macOS never has to parse a .p12 at all.
      # Directions 1/3/3b all failed at `security import` of a .p12 with "MAC
      # verification failed". The two SHA-256 checks below prove the secrets
      # arrived intact (same hashes as test.yml): if a hash mismatches, the
      # secret — not the format — is the problem, and the step stops there.
      # The certificate + key are imported into a temporary keychain
      # (/tmp/ci-signing.keychain-db), which the next step reads to find the
      # signing identity for Signing.xcconfig.
      - name: Import signing certificate
        env:
          MACOS_CODESIGN_CERT_PEM: ${{ secrets.MACOS_CODESIGN_CERT_PEM }}
          MACOS_CODESIGN_KEY_PEM: ${{ secrets.MACOS_CODESIGN_KEY_PEM }}
        run: |
          printf '%s' "$MACOS_CODESIGN_CERT_PEM" | base64 --decode > /tmp/TransPeek-signing.crt
          printf '%s' "$MACOS_CODESIGN_KEY_PEM" | base64 --decode > /tmp/TransPeek-signing.key
          [ "$(shasum -a 256 /tmp/TransPeek-signing.crt | cut -d' ' -f1)" = "9354805dff7a8f50af55ed83006eede90a6145442d8cf3992fd153a0cdf9761a" ] || { echo "ERROR: certificate secret does not match the local file"; exit 1; }
          [ "$(shasum -a 256 /tmp/TransPeek-signing.key | cut -d' ' -f1)" = "e81b462f615f202b3e143591726199c60e86ae49d3d633fb97ea8e569fda54bc" ] || { echo "ERROR: private key secret does not match the local file"; exit 1; }
          KEYCHAIN_PASSWORD="ci-signing-temp"
          security create-keychain -p "$KEYCHAIN_PASSWORD" /tmp/ci-signing.keychain-db
          security set-keychain-settings -lut 3600 /tmp/ci-signing.keychain-db
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" /tmp/ci-signing.keychain-db
          security import /tmp/TransPeek-signing.crt -k /tmp/ci-signing.keychain-db -T /usr/bin/codesign
          security import /tmp/TransPeek-signing.key -k /tmp/ci-signing.keychain-db -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" /tmp/ci-signing.keychain-db
          security default-keychain -s /tmp/ci-signing.keychain-db
          security find-identity -v -p codesigning /tmp/ci-signing.keychain-db
          rm -f /tmp/TransPeek-signing.crt /tmp/TransPeek-signing.key

      # Write Configurations/Signing.xcconfig from the imported identity, so
      # the archive step signs with the self-signed certificate. The identity
      # is read from the temporary keychain created above (NOT the
      # "signing_temp" keychain the old .p12 action used).
      # NOTE: the identity is used BY NAME here, not by hash from
      # `security find-identity`. That command returns 0 identities for this
      # self-signed certificate — observed in Release runs #2 and #3, with
      # AND without the "-p codesigning" policy flag — even though the
      # certificate and key import fine ("1 certificate imported", "1 key
      # imported") and `codesign --sign` by this same name works (test.yml
      # has signed that way since run #99). So looking the identity up is
      # unreliable here; naming it directly is what already works.
      # SPARKLE_ED_PUBLIC_KEY is Sparkle's public EdDSA key (public, safe to
      # hardcode — same literal as test.yml): without it the built app has no
      # updater key and Sparkle cannot start. DEVELOPMENT_TEAM comes from a
      # secret and stays empty for the self-signed certificate (there is no
      # Developer ID team while the $99/year membership is deferred).
      - name: Write Signing.xcconfig
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          SPARKLE_ED_PUBLIC_KEY=+aGGc4fF2j3XJ3maoDbbwh/MmxP7BqDBdRs4A/r8f2M=
          SIGNING_IDENTITY="TransPeek Self-Signed 100Years"
          # Diagnostic only (never fails the step): show the certificate's
          # SHA-1 hash from the temporary keychain, for the log.
          security find-certificate -c "$SIGNING_IDENTITY" -Z /tmp/ci-signing.keychain-db || true

          cat > Configurations/Signing.xcconfig << EOF
          TransPeek_CODE_SIGN_STYLE = Manual
          TransPeek_CODE_SIGN_IDENTITY = $SIGNING_IDENTITY
          TransPeek_DEVELOPMENT_TEAM = $DEVELOPMENT_TEAM
          SPARKLE_ED_PUBLIC_KEY = $SPARKLE_ED_PUBLIC_KEY
          EOF

      - name: Resolve dependencies and generate project
        run: tuist install && tuist generate

      # Textual pulls in swiftui-math, whose bundled math fonts add ~7 MB. TransPeek never enables
      # the math syntax extension and SwiftUIMath loads fonts lazily, so the files are dead weight.
      # Deleting them before the build keeps the code signature intact.
      - name: Strip unused math fonts
        run: |
          find .build/checkouts/swiftui-math/Sources/SwiftUIMath/mathFonts.bundle \
            \( -name '*.otf' -o -name '*.plist' \) -delete

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${{ github.event.inputs.version || '0.0.0-dev' }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run tests
        timeout-minutes: 15
        run: |
          xcodebuild test \
            -workspace TransPeek.xcworkspace \
            -scheme TransPeek \
            -destination 'platform=macOS' \
            -resultBundlePath build/Tests.xcresult \
            MACOSX_DEPLOYMENT_TARGET=15.0

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macOS-test-results
          path: build/Tests.xcresult
          if-no-files-found: ignore
          retention-days: 14

      - name: Archive
        run: |
          xcodebuild archive \
            -workspace TransPeek.xcworkspace \
            -scheme TransPeek \
            -configuration Release \
            -archivePath build/TransPeek.xcarchive \
            VALIDATE_STRINGS_FILES_WHILE_COPYING=NO \
            MARKETING_VERSION=${{ steps.version.outputs.version }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      # Verify the archive's signature is valid. A self-signed certificate
      # has NO TeamIdentifier by design (no Developer ID team while the
      # $99/year Apple Developer membership is deferred) — that is expected,
      # not a failure: the app is distributed outside the App Store and
      # Gatekeeper asks once on first launch. Only fail here if the
      # signature itself is invalid (checked above by --verify --strict).
      - name: Verify code signature
        run: |
          APP="build/TransPeek.xcarchive/Products/Applications/TransPeek.app"
          codesign --verify --strict "$APP"

          SIGN_INFO=$(codesign -dvvv "$APP" 2>&1)
          echo "$SIGN_INFO" | grep -E "Authority|Identifier|TeamIdentifier"

          if echo "$SIGN_INFO" | grep -q "TeamIdentifier=not set"; then
            echo "::warning::Code signature has no TeamIdentifier (self-signed certificate, expected)."
          fi

      - name: Prepare app bundle
        run: |
          mkdir -p build/app
          cp -R build/TransPeek.xcarchive/Products/Applications/TransPeek.app build/app/

      - name: Create ZIP
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/app/TransPeek.app \
            "TransPeek-v${{ steps.version.outputs.version }}-macOS.zip"

      - name: Package PopClip Extension
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            PopClipExtension/TransPeek.popclipext \
            "TransPeek.popclipext.zip"

      - name: Package OpenClip Extension
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            OpenClipExtension/TransPeek.openclipext \
            "TransPeek.openclipext.zip"

      - name: Check Sparkle signing key
        id: sparkle
        run: |
          if [ -n "$SPARKLE_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}

      - name: Download Sparkle CLI tools
        if: steps.sparkle.outputs.has_key == 'true'
        run: |
          SPARKLE_VERSION=$(python3 -c "import json; pins=json.load(open('Package.resolved'))['pins']; print(next(p['state']['version'] for p in pins if p['identity']=='sparkle'))")
          echo "Using Sparkle CLI v${SPARKLE_VERSION} (from Package.resolved)"
          mkdir -p /tmp/sparkle
          curl -sL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" | tar xJ -C /tmp/sparkle

      - name: Create DMG
        run: |
          create-dmg \
            --volname "TransPeek" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 160 \
            --icon "TransPeek.app" 180 170 \
            --app-drop-link 480 170 \
            --hide-extension "TransPeek.app" \
            "TransPeek-v${{ steps.version.outputs.version }}-macOS.dmg" \
            build/app/ \
            || test $? -eq 1

      - name: Generate appcast
        if: steps.sparkle.outputs.has_key == 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          mkdir -p build/release
          cp "TransPeek-v${{ steps.version.outputs.version }}-macOS.zip" build/release/

          # Download existing appcast to preserve history (skip if first release or invalid)
          curl -sfL "https://github.com/TranManhTuanLabs/TransPeek/releases/latest/download/appcast.xml" \
            -o appcast.xml || rm -f appcast.xml

          DOWNLOAD_URL="https://github.com/TranManhTuanLabs/TransPeek/releases/download/v${{ steps.version.outputs.version }}"
          /tmp/sparkle/bin/generate_appcast \
            --ed-key-file <(echo "$SPARKLE_ED_PRIVATE_KEY") \
            --download-url-prefix "$DOWNLOAD_URL/" \
            -o appcast.xml \
            build/release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: true
          files: |
            TransPeek-v${{ steps.version.outputs.version }}-macOS.zip
            TransPeek-v${{ steps.version.outputs.version }}-macOS.dmg
            TransPeek.popclipext.zip
            TransPeek.openclipext.zip
            appcast.xml
