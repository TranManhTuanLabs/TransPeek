name: Release

# Builds a real release from a v* tag (or manually, as a draft, via
# workflow_dispatch): runs tests, takes the exact app artifact test.yml
# already built and signed for this commit, then creates the DMG, the
# Sparkle appcast and the GitHub Release with the ZIP + DMG + appcast +
# PopClip/OpenClip extensions.
#
# Direction B (2026-11-12): build ONCE, promote the artifact. test.yml
# builds the app (on a [build-app] commit), signs it by hand with the
# self-signed certificate "TransPeek Self-Signed 100Years" (Direction 4b,
# PEM — see docs/SELF-SIGNED-CERTIFICATE-GUIDE.md §7) and uploads it as
# artifact TransPeek-macOS-<Tests run number> (7-day retention; renamed
# 2026-11-13 from the plain "TransPeek-macOS" so each download is distinct
# — the "Find tested build" step below still accepts the old plain name).
# This workflow downloads THAT artifact and ships it — it does NOT archive
# or sign again. That fixes two problems of the old archive flow (removed
# 2026-11-12, see docs/GIT-CI-BUILD-SETUP.md §4): (1) the build number: the
# old Archive step stamped CURRENT_PROJECT_VERSION with this workflow's own
# run number (the 0.0.0-dev draft was build 7, while the installed v0.1.0
# is build 126), so Sparkle would see a new release as OLDER and never
# offer it as an update; the artifact already carries the Tests run number,
# which always increases. (2) The shipped binary is now the exact binary
# that was tested — the old flow archived a second, different binary.
# The release therefore needs a green [build-app] Tests run for the tagged
# commit; if there is none, it fails loudly instead of shipping an
# untested build. Permissions include actions: read so the workflow can
# list runs and download the artifact of test.yml.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 0.1.0)"
        required: false
        default: "0.0.0-dev"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: macos-26
    environment: Prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Install Tuist via mise
        uses: jdx/mise-action@v2
        with:
          install: true

      # Signing.xcconfig is git-ignored (only .example is in the repo), so
      # copy it before generate — Project.swift references it and `tuist
      # generate` fails its lint ("Configuration file not found", "Fatal
      # linting issues found") without it. test.yml does the same copy.
      - name: Resolve dependencies and generate project
        run: |
          cp Configurations/Signing.xcconfig.example Configurations/Signing.xcconfig
          tuist install && tuist generate

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${{ github.event.inputs.version || '0.0.0-dev' }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # SPARKLE_ED_PUBLIC_KEY is the Sparkle updater key (do not hardcode a
      # different one): without it the built app has no updater key and Sparkle
      # cannot start. CODE_SIGNING_ALLOWED=NO because tests do not need a
      # signed app — without it xcodebuild tries to sign with the placeholder
      # identity in Signing.xcconfig (YOUR_TEAM_ID) and fails before any test
      # runs (Release #15, 2026-11-13).
      - name: Run tests
        timeout-minutes: 15
        run: |
          xcodebuild test \
            -workspace TransPeek.xcworkspace \
            -scheme TransPeek \
            -destination 'platform=macOS' \
            -resultBundlePath build/Tests.xcresult \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            SPARKLE_ED_PUBLIC_KEY=+aGGc4fF2j3XJ3maoDbbwh/MmxP7BqDBdRs4A/r8f2M= \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macOS-test-results
          path: build/Tests.xcresult
          if-no-files-found: ignore
          retention-days: 14

      # Find the green Tests run that built the artifact for this commit.
      # The release ships exactly that artifact (direction B) — the build
      # number in it is the Tests run number, which is what Sparkle
      # compares, so a new release is always newer than the installed app.
      # A run only counts if it actually has the app artifact (a tests-only
      # run has none). The artifact name is the new "TransPeek-macOS-<run
      # number>" (or the old plain "TransPeek-macOS" for runs before the
      # 2026-11-13 rename) — this step outputs the exact name it found, so
      # the Download step below uses the right one. For a tag run the
      # artifact MUST be for this exact commit (the gate: bump version +
      # [build-app] + tag); if there is no green Tests run for the commit,
      # fail loudly instead of shipping an untested build. For a manual
      # dispatch (a pipeline test, not a real release) fall back to the
      # latest green Tests run on main, and say so in the log.
      - name: Find tested build
        id: tested
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find_run_with_artifact() {
            # NOTE: `gh api --jq` takes the jq expression directly — there is
            # no `-r` flag for `gh api` (`-r` belongs to standalone jq). Writing
            # `--jq -r '...'` makes `--jq` swallow `-r` as its value and leaves
            # the expression as a second positional argument, so gh errors with
            # "accepts 1 arg(s), received 2" (Release #16, 2026-11-13).
            CANDIDATES=$(gh api "repos/${{ github.repository }}/actions/workflows/test.yml/runs?$1&status=success&per_page=5" --jq '.workflow_runs[].id')
            for CANDIDATE in $CANDIDATES; do
              ARTIFACT_NAME=$(gh api "repos/${{ github.repository }}/actions/runs/$CANDIDATE/artifacts" --jq '.artifacts[].name | select(. == "TransPeek-macOS" or startswith("TransPeek-macOS-"))' | head -n 1)
              if [ -n "$ARTIFACT_NAME" ]; then
                echo "$CANDIDATE $ARTIFACT_NAME"
                return 0
              fi
            done
            return 1
          }
          FOUND=$(find_run_with_artifact "head_sha=${{ github.sha }}" || true)
          if [ -z "$FOUND" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::warning::No green Tests run with an artifact for this commit; falling back to the latest green Tests run on main (dispatch test only)."
              FOUND=$(find_run_with_artifact "branch=main" || true)
            fi
          fi
          [ -n "$FOUND" ] || { echo "ERROR: no green Tests run with a TransPeek-macOS artifact found for this commit — run test.yml with [build-app] first, then tag."; exit 1; }
          RUN_ID="${FOUND%% *}"
          ARTIFACT_NAME="${FOUND#* }"
          RUN_NUMBER=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID" --jq '.run_number')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run_number=$RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "Using tested build from Tests run #$RUN_NUMBER (run id $RUN_ID, artifact $ARTIFACT_NAME)."

      # Download the tested artifact (the signed app test.yml built) and
      # unpack it. The artifact name comes from the "Find tested build"
      # step — it is "TransPeek-macOS-<run number>" for new runs (or the
      # old plain "TransPeek-macOS" for runs before the 2026-11-13 rename),
      # and the zip file inside has the same name plus ".zip". `gh run
      # download` is the same CLI test.yml already uses for artifacts (see
      # its "Delete older app artifacts" step). The artifact is kept 7 days
      # and test.yml deletes older ones, so the tag must be pushed while
      # this artifact is the newest — which is the normal flow (tag right
      # after Tests goes green).
      - name: Download tested app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ steps.tested.outputs.run_id }}" --name "${{ steps.tested.outputs.artifact_name }}" --dir build/tested
          unzip -q "build/tested/${{ steps.tested.outputs.artifact_name }}.zip" -d build/tested
          ls -la build/tested/

      # Prove the downloaded app is the one we mean to ship: it exists,
      # its build number is the Tests run number (so Sparkle will see the
      # release as newer), and its signature verifies. For a tag run the
      # version must also match the tag. A self-signed certificate has no
      # TeamIdentifier by design — that is expected, not a failure.
      - name: Verify downloaded app
        run: |
          APP="build/tested/TransPeek.app"
          [ -d "$APP" ] || { echo "ERROR: TransPeek.app not found in the downloaded artifact"; exit 1; }
          BUILD=$(python3 -c "import plistlib; print(plistlib.load(open('$APP/Contents/Info.plist','rb')).get('CFBundleVersion'))")
          SHORT=$(python3 -c "import plistlib; print(plistlib.load(open('$APP/Contents/Info.plist','rb')).get('CFBundleShortVersionString'))")
          echo "Downloaded app: version $SHORT (build $BUILD); release version ${{ steps.version.outputs.version }}; Tests run #${{ steps.tested.outputs.run_number }}"
          [ "$BUILD" = "${{ steps.tested.outputs.run_number }}" ] || { echo "ERROR: app build $BUILD does not match Tests run #${{ steps.tested.outputs.run_number }}"; exit 1; }
          if [ "${{ github.ref_type }}" = "tag" ]; then
            [ "$SHORT" = "${{ steps.version.outputs.version }}" ] || { echo "ERROR: app version $SHORT does not match tag version ${{ steps.version.outputs.version }}"; exit 1; }
          fi
          codesign --verify --verbose "$APP"
          codesign -dvvv "$APP" 2>&1 | grep -E "Authority|Identifier|TeamIdentifier" || true

      - name: Prepare app bundle
        run: |
          mkdir -p build/app
          cp -R build/tested/TransPeek.app build/app/

      - name: Create ZIP
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/app/TransPeek.app \
            "TransPeek-v${{ steps.version.outputs.version }}-macOS.zip"

      - name: Package PopClip Extension
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            PopClipExtension/TransPeek.popclipext \
            "TransPeek.popclipext.zip"

      - name: Package OpenClip Extension
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            OpenClipExtension/TransPeek.openclipext \
            "TransPeek.openclipext.zip"

      - name: Check Sparkle signing key
        id: sparkle
        run: |
          if [ -n "$SPARKLE_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}

      - name: Download Sparkle CLI tools
        if: steps.sparkle.outputs.has_key == 'true'
        run: |
          SPARKLE_VERSION=$(python3 -c "import json; pins=json.load(open('Package.resolved'))['pins']; print(next(p['state']['version'] for p in pins if p['identity']=='sparkle'))")
          echo "Using Sparkle CLI v${SPARKLE_VERSION} (from Package.resolved)"
          mkdir -p /tmp/sparkle
          curl -sL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" | tar xJ -C /tmp/sparkle

      - name: Create DMG
        run: |
          create-dmg \
            --volname "TransPeek" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 160 \
            --icon "TransPeek.app" 180 170 \
            --app-drop-link 480 170 \
            --hide-extension "TransPeek.app" \
            "TransPeek-v${{ steps.version.outputs.version }}-macOS.dmg" \
            build/app/ \
            || test $? -eq 1

      - name: Generate appcast
        if: steps.sparkle.outputs.has_key == 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          mkdir -p build/release
          cp "TransPeek-v${{ steps.version.outputs.version }}-macOS.zip" build/release/

          # Download existing appcast to preserve history (skip if first release or invalid)
          curl -sfL "https://github.com/TranManhTuanLabs/TransPeek/releases/latest/download/appcast.xml" \
            -o appcast.xml || rm -f appcast.xml

          DOWNLOAD_URL="https://github.com/TranManhTuanLabs/TransPeek/releases/download/v${{ steps.version.outputs.version }}"
          /tmp/sparkle/bin/generate_appcast \
            --ed-key-file <(echo "$SPARKLE_ED_PRIVATE_KEY") \
            --download-url-prefix "$DOWNLOAD_URL/" \
            -o appcast.xml \
            build/release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: true
          files: |
            TransPeek-v${{ steps.version.outputs.version }}-macOS.zip
            TransPeek-v${{ steps.version.outputs.version }}-macOS.dmg
            TransPeek.popclipext.zip
            TransPeek.openclipext.zip
            appcast.xml
